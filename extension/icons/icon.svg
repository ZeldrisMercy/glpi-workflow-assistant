<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GLPI Assistant infinity icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="infinity" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#dff7ff"/>
      <stop offset="1" stop-color="#82dcff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)" stroke="#dff7ff" stroke-opacity="0.22"/>
  <text x="32" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="300" fill="url(#infinity)" filter="url(#glow)">∞</text>
</svg>
