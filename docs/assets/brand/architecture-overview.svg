<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">GLPI Workflow Assistant architecture overview</title>
  <desc id="desc">Local trust boundary containing the Browser Bridge, FastAPI service, validation, SQLite and human approval before GLPI REST writes, with optional WAHA.</desc>
  <rect width="1200" height="600" rx="28" fill="#090d16"/>
  <text x="56" y="62" fill="#f8fafc" font-family="ui-monospace, Consolas, monospace" font-size="26" font-weight="700">ARCHITECTURE / TRUST BOUNDARIES</text>
  <rect x="44" y="92" width="760" height="440" rx="24" fill="#0f1624" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="70" y="126" fill="#7dd3fc" font-family="ui-monospace, Consolas, monospace" font-size="14">LOCAL OPERATOR BOUNDARY · 127.0.0.1</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="16" text-anchor="middle">
    <g transform="translate(84 180)"><rect width="190" height="88" rx="14" fill="#151e2f" stroke="#475569"/><text x="95" y="38" fill="#e2e8f0">Browser Bridge</text><text x="95" y="62" fill="#94a3b8" font-size="13">capture + transport</text></g>
    <g transform="translate(330 180)"><rect width="190" height="88" rx="14" fill="#151e2f" stroke="#6366f1"/><text x="95" y="38" fill="#e2e8f0">FastAPI service</text><text x="95" y="62" fill="#94a3b8" font-size="13">loopback API</text></g>
    <g transform="translate(576 180)"><rect width="190" height="88" rx="14" fill="#151e2f" stroke="#a855f7"/><text x="95" y="38" fill="#e2e8f0">Plan validator</text><text x="95" y="62" fill="#94a3b8" font-size="13">Dry Run digest</text></g>
    <g transform="translate(330 348)"><rect width="190" height="88" rx="14" fill="#151e2f" stroke="#475569"/><text x="95" y="38" fill="#e2e8f0">Local SQLite</text><text x="95" y="62" fill="#94a3b8" font-size="13">intent + receipts</text></g>
    <g transform="translate(576 348)"><rect width="190" height="88" rx="14" fill="#0f201b" stroke="#22c55e"/><text x="95" y="38" fill="#86efac">Human approval</text><text x="95" y="62" fill="#cbd5e1" font-size="13">current plan only</text></g>
    <g transform="translate(874 180)"><rect width="270" height="88" rx="14" fill="#151e2f" stroke="#22c55e"/><text x="135" y="38" fill="#e2e8f0">GLPI REST API</text><text x="135" y="62" fill="#94a3b8" font-size="13">remote privileged boundary</text></g>
    <g transform="translate(874 348)"><rect width="270" height="88" rx="14" fill="#151e2f" stroke="#64748b"/><text x="135" y="38" fill="#e2e8f0">WAHA · optional</text><text x="135" y="62" fill="#94a3b8" font-size="13">restricted message path</text></g>
  </g>
  <g fill="none" stroke-width="3"><path d="M274 224h56M520 224h56" stroke="#6366f1"/><path d="M671 268v80" stroke="#a855f7"/><path d="M576 392h-56" stroke="#475569"/><path d="M766 392c70 0 50-168 108-168" stroke="#22c55e"/><path d="M766 410h108" stroke="#64748b" stroke-dasharray="7 7"/></g>
  <text x="44" y="570" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="13">Writes require a current plan. Uncertain results are not retried blindly.</text>
</svg>
