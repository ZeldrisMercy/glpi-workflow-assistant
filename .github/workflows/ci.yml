name: CI

on:
  push:
    branches: [main, release/public-beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            package/usr/lib/glpi-assistant/app/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r package/usr/lib/glpi-assistant/app/requirements.txt -r requirements-dev.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Python regression suite
        env:
          GLPI_ASSISTANT_DATA: ${{ runner.temp }}/glpi-assistant-tests
        run: python -m pytest tests qa/test_waha_installer.py -q
      - name: JavaScript syntax and DOM regressions
        run: python scripts/check_javascript.py
      - name: Documentation link contract
        run: python -m pytest tests/test_release_contract.py -k missing_paths -q
      - name: Publication audit
        run: python scripts/audit_publication.py .
      - name: Python dependency vulnerability audit
        run: python -m pip_audit -r package/usr/lib/glpi-assistant/app/requirements.txt -r requirements-dev.txt
      - name: npm dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Build deterministic release artifacts
        run: python scripts/build_portfolio.py
      - name: Verify manifest, SBOM and artifact set
        run: python scripts/verify_release.py dist
      - name: Verify artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Audit generated archives
        run: python scripts/audit_publication.py dist
