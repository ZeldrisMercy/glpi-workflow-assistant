name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r package/usr/lib/glpi-assistant/app/requirements.txt -r requirements-dev.txt
      - name: Validate publication files
        run: |
          test -f README.md
          test -f README.en.md
          test -f SECURITY.md
          test -f docs/publication-checklist.md
          test -f docs/VALIDACAO_3.4.0-rc4.json
      - name: Build package and extension artifacts
        run: python scripts/build_portfolio.py
      - name: Verify generated hashes
        run: cd dist && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: glpi-assistant-rc4-build
          path: |
            dist/*.deb
            dist/*.zip
            dist/*.xpi
            dist/SHA256SUMS
            dist/package-manifest.json
          if-no-files-found: error
          retention-days: 14
