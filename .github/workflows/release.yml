name: Beta release candidate

on:
  push:
    tags:
      - v3.4.0-beta.1
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact beta version to validate
        required: true
        type: choice
        options:
          - v3.4.0-beta.1

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name == 'push' || inputs.candidate == 'v3.4.0-beta.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r package/usr/lib/glpi-assistant/app/requirements.txt -r requirements-dev.txt
          npm ci
      - name: Validate exact candidate
        env:
          GLPI_ASSISTANT_DATA: ${{ runner.temp }}/glpi-assistant-tests
        run: |
          python -m pytest tests qa/test_waha_installer.py -q
          python scripts/check_javascript.py
          python scripts/audit_publication.py .
          python scripts/build_portfolio.py
          python scripts/verify_release.py dist
          python scripts/audit_publication.py dist
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: glpi-workflow-assistant-v3.4.0-beta.1
          path: |
            dist/glpi-assistant_3.4.0~beta.1-1_all.deb
            dist/glpi-assistant-bridge_2.4.0_chromium.zip
            dist/glpi-assistant-bridge_2.4.0_firefox-dev.xpi
            dist/SHA256SUMS
            dist/package-manifest.json
            dist/sbom.cdx.json
            docs/project/validation-matrix.md
          if-no-files-found: error
          retention-days: 30
